[package]
name = "rsdb-usb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RSDB RTL-SDR USB receiver and collector diagnostics"

[features]
default = ["websocket"]
websocket = []

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
rs-rtl = "0.4.1"
rsdb = { version = "0.1.0", package = "rsdb-host", path = "../rsdb-host" }
rsdb-core = { version = "0.1.0", path = "../rsdb-core", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
webpki-roots = "1"

[lints]
workspace = true
