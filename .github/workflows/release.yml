name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"
  TARGET: aarch64-unknown-linux-gnu

jobs:
  raspberry-pi:
    name: Raspberry Pi ARM64 artifacts
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install OS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zstd

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$TARGET"

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build:web

      - name: Build Rust binaries
        run: |
          cargo build --release --target "$TARGET" -p rsdb-usb --bin rsdb-usb
          cargo build --release --target "$TARGET" -p rsdb-aggregate --bin rsdb-aggregate

      - name: Resolve release metadata
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release_tag="$GITHUB_REF_NAME"
            release_channel=stable
            build_version="$GITHUB_REF_NAME"
          else
            release_tag=nightly
            release_channel=nightly
            build_version="nightly-$(printf '%s' "$GITHUB_SHA" | cut -c 1-12)"
          fi

          {
            printf 'RSDB_RELEASE_TAG=%s\n' "$release_tag"
            printf 'RSDB_RELEASE_CHANNEL=%s\n' "$release_channel"
            printf 'RSDB_BUILD_VERSION=%s\n' "$build_version"
          } >>"$GITHUB_ENV"

      - name: Package artifacts
        run: |
          set -eu

          dist_dir="$PWD/dist/release"
          bin_dir="$PWD/target/$TARGET/release"
          rm -rf "$dist_dir"
          mkdir -p "$dist_dir"

          package_profile() {
            profile="$1"
            stage="$RUNNER_TEMP/rsdb-$profile"
            artifact="rsdb-$profile-$TARGET.tar.zst"

            rm -rf "$stage"
            mkdir -p "$stage/bin" "$stage/share/rsdb"

            install -m 0755 "$bin_dir/rsdb-usb" "$stage/bin/rsdb-usb"
            if [ "$profile" = full ]; then
              install -m 0755 "$bin_dir/rsdb-aggregate" "$stage/bin/rsdb-aggregate"
            fi

            cat >"$stage/share/rsdb/release.env" <<EOF
          RSDB_RELEASE_TAG=$RSDB_RELEASE_TAG
          RSDB_RELEASE_CHANNEL=$RSDB_RELEASE_CHANNEL
          RSDB_BUILD_VERSION=$RSDB_BUILD_VERSION
          RSDB_BUILD_COMMIT=$GITHUB_SHA
          RSDB_BUILD_TARGET=$TARGET
          RSDB_BUILD_PROFILE=$profile
          EOF

            tar --zstd -cf "$dist_dir/$artifact" -C "$stage" .
          }

          package_profile receiver
          package_profile full

          cd "$dist_dir"
          sha256sum rsdb-*.tar.zst >checksums.txt

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          notes_file="$RUNNER_TEMP/release-notes.md"
          printf 'Raspberry Pi ARM64 release artifacts for %s.\n' "$RSDB_RELEASE_TAG" >"$notes_file"

          if gh release view "$RSDB_RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RSDB_RELEASE_TAG" --title "$RSDB_RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RSDB_RELEASE_TAG" --title "$RSDB_RELEASE_TAG" --notes-file "$notes_file"
          fi

          gh release upload "$RSDB_RELEASE_TAG" dist/release/* --clobber

      - name: Publish nightly prerelease
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly

          notes_file="$RUNNER_TEMP/nightly-notes.md"
          {
            printf 'Nightly Raspberry Pi ARM64 artifacts.\n\n'
            printf 'Commit: %s\n' "$GITHUB_SHA"
          } >"$notes_file"

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title nightly --notes-file "$notes_file" --prerelease
          else
            gh release create nightly --title nightly --notes-file "$notes_file" --prerelease
          fi

          gh release upload nightly dist/release/* --clobber
