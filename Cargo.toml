[workspace]
members = [
    "crates/rsdb-aggregate",
    "crates/rsdb-core",
    "crates/rsdb-host",
    "crates/rsdb-usb",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"
